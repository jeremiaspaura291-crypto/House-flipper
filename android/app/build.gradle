plugins { id 'com.android.application' }

android {
    namespace 'com.house.flipper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.house.flipper'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Wpedantic'
                arguments '-DNEON_BUILD_TESTS=OFF', '-DPLATFORM=Android'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
