name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Install NDK
      run: |
        echo "y" | sudo ${ANDROID_HOME}/tools/bin/sdkmanager --install "ndk;21.4.7075529"

    - name: Download SDL2
      run: |
        wget https://www.libsdl.org/release/SDL2-2.0.14.tar.gz
        tar -xzf SDL2-2.0.14.tar.gz
        mv SDL2-2.0.14 SDL

    - name: Build with Gradle
      run: |
        cd android
        # Instalamos Gradle manualmente para asegurar que funcione sin el wrapper
        sudo apt-get update
        sudo apt-get install -y gradle
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v2
      with:
        name: HouseFlipper_APK
        path: android/app/build/outputs/apk/debug/*.apk
        
